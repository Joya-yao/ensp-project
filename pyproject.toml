[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ensp-labgen"
version = "0.1.0"
description = "读取 eNSP 拓扑与结构化要求，生成 VRP 配置文档"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["pywebview>=5"]   # 可选：把网页界面装进独立窗口，不装则用浏览器打开

[project.scripts]
labgen = "labgen.topo:_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
